<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="theme-color" content="#008b2c">
<meta name="referrer" content="no-referrer">
<title>تتبع طلبك — سرعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
:root{--bg:#f3f7f4;--panel:#fff;--panel2:#eef3ef;--line:#e1e8e3;--text:#16241c;--muted:#6b7d72;
  --accent:#008b2c;--accent2:#00b84a;--accent-soft:rgba(0,139,44,.1);--amber:#d97706;--shadow:0 8px 28px rgba(16,36,24,.08);}
@media (prefers-color-scheme:dark){:root{--bg:#0d1410;--panel:#152019;--panel2:#1b2920;--line:#25362b;--text:#e7f1ea;--muted:#8fa597;--accent:#1fbf55;--accent2:#34d36b;--accent-soft:rgba(31,191,85,.14);--shadow:0 8px 28px rgba(0,0,0,.35);}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hdr{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 46px;text-align:center;}
.hdr .logo{width:52px;height:52px;display:block;margin:0 auto 6px;}
.hdr h1{font-size:20px;font-weight:900;margin-top:2px;}
.hdr p{font-size:12px;opacity:.9;}
.wrap{max-width:600px;margin:-30px auto 0;padding:0 14px 24px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.status{text-align:center;}
.status .ic{font-size:44px;}
.status h2{font-size:19px;font-weight:900;margin-top:6px;}
.status p{color:var(--muted);font-size:13px;margin-top:4px;}
.steps{display:flex;margin:18px 0 4px;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11px;font-weight:700;color:var(--muted);}
.step .c{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;font-weight:900;z-index:1;}
.step::before{content:'';position:absolute;top:17px;left:50%;width:100%;height:3px;background:var(--line);}
.step:first-child::before{display:none;}
.step.done .c,.step.now .c{background:var(--accent);border-color:var(--accent);color:#fff;}
.step.done::before,.step.now::before{background:var(--accent);}
.step.now{color:var(--accent);}
.step.now .c{box-shadow:0 0 0 6px var(--accent-soft);}
#map{height:300px;border-radius:16px;border:1px solid var(--line);margin-bottom:12px;z-index:0;}
.cap-marker{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:3px solid #fff;display:grid;place-items:center;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.35);}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);font-weight:800;}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite;}
.live.stale{color:var(--amber);}
@keyframes blink{50%{opacity:.3}}
.kv div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
.kv div:last-child{border-bottom:none;}
.kv span:first-child{color:var(--muted);}
.kv span:last-child{font-weight:800;}
.kv .total span:last-child{color:var(--accent);font-size:16px;}
.msg{text-align:center;padding:40px 16px;color:var(--muted);}
.msg .ic{font-size:52px;margin-bottom:10px;}
.msg h2{color:var(--text);font-size:18px;margin-bottom:6px;}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:8px;}
</style>
</head>
<body>
<div class="hdr"><img class="logo" src="logo.svg" alt="شعار سرعة"><h1>تتبع طلبك</h1><p>منصة سرعة للتوصيل</p></div>
<div class="wrap" id="root"><div class="card msg"><div class="ic">⏳</div><h2>جاري تحميل الطلب…</h2></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAwlFrbv-c6G0_K0-s0P1m1o_qD95aGGyQ",
  authDomain: "sora3a-system.firebaseapp.com",
  projectId: "sora3a-system",
  storageBucket: "sora3a-system.firebasestorage.app",
  messagingSenderId: "516304449260",
  appId: "1:516304449260:web:e0d2e20d8964e4d6656733"
}, "sora3a-track");
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString('en-US');
const orderId = new URLSearchParams(location.search).get('order') || new URLSearchParams(location.search).get('id') || '';

const ST = {
  preparing:  { ic: '🍳', t: 'المطعم يجهّز طلبك', s: 'أول ما يجهز يطلع ويا الكابتن', i: -1 },
  ready:      { ic: '📦', t: 'طلبك جاهز', s: 'يتم تحويل طلبك إلى الكابتن', i: -1 },
  pending:    { ic: '🟡', t: 'بانتظار قبول الكابتن', s: 'المطعم يجهّز طلبك', i: -1 },
  accepted:   { ic: '🔵', t: 'الكابتن قبل طلبك', s: 'الكابتن في طريقه للمطعم', i: 0 },
  pickup:     { ic: '🟠', t: 'الكابتن استلم طلبك', s: 'سينطلق إليك خلال لحظات', i: 1 },
  delivering: { ic: '🛵', t: 'الكابتن في الطريق إليك', s: 'تابع موقعه على الخريطة', i: 2 },
  delivered:  { ic: '✅', t: 'تم تسليم طلبك', s: 'بالعافية! شكراً لاختيارك', i: 4 },
  cancelled:  { ic: '❌', t: 'أُلغي الطلب', s: 'تواصل مع المطعم للاستفسار', i: -1 },
};

let map = null, marker = null, lastKey = null;

function msg(ic, title, sub) {
  $('root').innerHTML = `<div class="card msg"><div class="ic">${ic}</div><h2>${esc(title)}</h2><p>${esc(sub || '')}</p></div>`;
  map = null; marker = null; lastKey = null;
}

// معرّف Firestore: أحرف وأرقام فقط
if (!/^[A-Za-z0-9]{10,40}$/.test(orderId)) {
  msg('❓', 'رابط غير صالح', 'تأكد من الرابط أو تواصل مع المطعم');
} else {
  onSnapshot(doc(db, 'tracking', orderId), (snap) => {
    if (!snap.exists()) { msg('❓', 'الطلب غير موجود', 'قد يكون الرابط قديماً — تواصل مع المطعم'); return; }
    render(snap.data());
  }, () => msg('⚠️', 'تعذّر تحميل الطلب', 'تحقق من الإنترنت وأعد المحاولة'));
}

function render(o) {
  const st = ST[o.status] || ST.pending;
  const showMap = ['accepted', 'pickup', 'delivering'].includes(o.status) && typeof o.lat === 'number' && typeof L !== 'undefined';
  // نعيد بناء الصفحة فقط عند تغيّر البيانات النصية، ونحرّك العلامة عند تغيّر الموقع فقط
  const key = JSON.stringify([o.status, o.restaurantName, o.captainName, o.value, o.fee, showMap]);
  if (key !== lastKey) {
    lastKey = key;
    const labels = ['قبول', 'استلام', 'بالطريق', 'تسليم'];
    $('root').innerHTML = `
      <div class="card status">
        <div class="ic">${st.ic}</div><h2>${st.t}</h2><p>${st.s}</p>
        ${o.status !== 'cancelled' ? `<div class="steps">${labels.map((l, i) => `<div class="step ${i < st.i ? 'done' : i === st.i ? 'now' : ''}"><div class="c">${i < st.i ? '✓' : i + 1}</div>${l}</div>`).join('')}</div>` : ''}
      </div>
      ${showMap ? `<div class="card" style="padding:12px"><div id="map"></div><div style="text-align:center"><span class="live" id="live"><i></i><span>موقع الكابتن مباشرة</span></span></div></div>` : ''}
      <div class="card kv">
        <div><span>رقم الطلب</span><span>#${esc(orderId.substring(0, 6).toUpperCase())}</span></div>
        <div><span>المطعم</span><span>${esc(o.restaurantName || '—')}</span></div>
        ${o.captainName ? `<div><span>الكابتن 🛵</span><span>${esc(o.captainName)}</span></div>` : ''}
        ${typeof o.value === 'number' ? `<div><span>قيمة الطلب</span><span>${fmt(o.value)} د.ع</span></div>` : ''}
        ${typeof o.fee === 'number' ? `<div><span>التوصيل</span><span>${fmt(o.fee)} د.ع</span></div>` : ''}
        ${typeof o.value === 'number' ? `<div class="total"><span>الإجمالي</span><span>${fmt((o.value || 0) + (o.fee || 0))} د.ع</span></div>` : ''}
      </div>
      <div class="foot">🔒 لا تُعرض بياناتك الشخصية في هذه الصفحة</div>`;
    map = null; marker = null;
    if (showMap) initMap();
  }
  if (showMap && map) moveCaptain(o.lat, o.lng, o.locTs);
}

function initMap() {
  map = L.map('map').setView([33.3152, 44.3661], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
  setTimeout(() => map && map.invalidateSize(), 200);
}

function moveCaptain(lat, lng, ts) {
  const icon = L.divIcon({ html: '<div class="cap-marker">🛵</div>', className: '', iconSize: [42, 42], iconAnchor: [21, 21] });
  if (!marker) { marker = L.marker([lat, lng], { icon }).addTo(map); map.setView([lat, lng], 15); }
  else marker.setLatLng([lat, lng]);
  const stale = !!ts && Date.now() - ts > 90000;
  const live = $('live');
  if (live) { live.classList.toggle('stale', stale); live.lastChild.textContent = stale ? 'آخر موقع معروف' : 'موقع الكابتن مباشرة'; }
}
</script>
</body>
</html>
