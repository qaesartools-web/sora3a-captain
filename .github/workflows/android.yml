# يبني تطبيق الكابتن للأندرويد (APK) وينشره بصفحة Releases
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Signing key (generated per build)
        run: |
          echo "KEYSTORE_PASS=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: keytool -genkeypair -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -alias sora3a -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sora3a Captain"

      - name: Build
        working-directory: android
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: gradle --no-daemon assembleRelease

      - run: cp android/app/build/outputs/apk/release/app-release.apk sora3a-captain.apk
      - uses: actions/upload-artifact@v4
        with: { name: sora3a-captain-apk, path: sora3a-captain.apk }

      - name: Ready to publish?
        id: ready
        run: grep -q '^appId=PENDING' android/firebase.properties && echo "ok=false" >> "$GITHUB_OUTPUT" || echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.event_name != 'pull_request' && steps.ready.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: captain-app-${{ github.run_number }}
          name: تطبيق الكابتن ${{ github.run_number }}
          make_latest: true
          files: sora3a-captain.apk
