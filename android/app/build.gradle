plugins { id 'com.android.application' }

def fb = new Properties()
file('../firebase.properties').withInputStream { fb.load(it) }

android {
    namespace 'iq.sora3a.captain'
    compileSdk 34
    defaultConfig {
        applicationId 'iq.sora3a.captain'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
        buildConfigField 'String', 'FB_APP_ID', "\"${fb.appId}\""
        buildConfigField 'String', 'FB_API_KEY', "\"${fb.apiKey}\""
        buildConfigField 'String', 'FB_PROJECT_ID', "\"${fb.projectId}\""
        buildConfigField 'String', 'FB_SENDER_ID', "\"${fb.senderId}\""
        buildConfigField 'String', 'START_URL', '"https://qaesartools-web.github.io/sora3a-captain/captain.html"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'none.jks')
            storePassword System.getenv('KEYSTORE_PASS') ?: ''
            keyAlias 'sora3a'
            keyPassword System.getenv('KEYSTORE_PASS') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.4.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.13.1'
}
